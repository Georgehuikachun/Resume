name: 投资组合监控

on:
  schedule:
    # GitHub 免费定时常漏跑单个时间点,故每个时段放多个备用触发点;
    # 同时段去重(上午/下午)保证只通知一次,不会重复打扰。
    # 上午(阿德莱德约 10:30~11:30,UTC hour<3 判为上午):
    - cron: '0 1 * * 1-5'
    - cron: '20 1 * * 1-5'
    - cron: '40 1 * * 1-5'
    - cron: '0 2 * * 1-5'
    # 下午(阿德莱德约 14:30~15:30,UTC hour>=3 判为下午):
    - cron: '0 5 * * 1-5'
    - cron: '20 5 * * 1-5'
    - cron: '40 5 * * 1-5'
    - cron: '0 6 * * 1-5'
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r INVESTMENT_ASSISTANT/requirements.txt

      - name: 运行信号引擎
        run: python INVESTMENT_ASSISTANT/assistant.py

      - name: AI 投资经理点评(可选,需配置 ANTHROPIC_API_KEY secret)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python INVESTMENT_ASSISTANT/ai_advisor.py
          else
            echo "未配置 ANTHROPIC_API_KEY,跳过 AI 点评(核心功能不受影响)。"
          fi
        continue-on-error: true

      - name: 创建仓位报告 Issue(每日两次)
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const fs = require('fs');
            const alerts = JSON.parse(fs.readFileSync('INVESTMENT_ASSISTANT/alerts.json', 'utf8'));
            const report = fs.readFileSync('INVESTMENT_ASSISTANT/report.md', 'utf8');
            const date = new Date().toISOString().slice(0, 10);
            const slot = new Date().getUTCHours() < 3 ? '上午' : '下午';
            const actionCount = alerts.action_count || 0;
            let title;
            if (alerts.has_urgent) {
              title = `🟥 ${date} ${slot} 紧急操作提醒(${actionCount} 条需执行)`;
            } else if (actionCount > 0) {
              title = `📋 ${date} ${slot} 有 ${actionCount} 条建议操作`;
            } else if (alerts.alert_count > 0) {
              title = `💡 ${date} ${slot} 今日情况(仅供参考,无需操作)`;
            } else {
              title = `✅ ${date} ${slot} 一切正常,继续持有`;
            }
            // 同一时段不重复创建(手动触发时防止重复;上午/下午各自独立)
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'investment-alert',
              state: 'open',
              per_page: 50,
            });
            if (existing.data.some(i => i.title.includes(`${date} ${slot}`))) {
              core.info(`${date} ${slot} 通知已存在,跳过。`);
              return;
            }
            const newIssue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: report,
              labels: ['investment-alert'],
              assignees: [context.repo.owner],
            });

            // Telegram 弹窗推送(仅发标题+链接,不含金额;凭据来自用户的 GitHub Secret)
            const tgToken = process.env.TELEGRAM_BOT_TOKEN;
            const tgChat = process.env.TELEGRAM_CHAT_ID;
            if (tgToken && tgChat) {
              const text = `${title}\n点开查看完整报告 → ${newIssue.data.html_url}`;
              try {
                const r = await fetch(`https://api.telegram.org/bot${tgToken}/sendMessage`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ chat_id: tgChat, text, disable_web_page_preview: false }),
                });
                core.info(`Telegram 推送状态:${r.status}`);
              } catch (e) {
                core.warning(`Telegram 推送失败(不影响报告):${e}`);
              }
            } else {
              core.info('未配置 Telegram Secret,跳过弹窗推送。');
            }
